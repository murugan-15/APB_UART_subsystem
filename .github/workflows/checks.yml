#
# Light checks that need no EDA tool (D-015). The pinned-image workflow of D-010 comes at Gate 9.
name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  documents-and-scripts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install the checkers (versions pinned in requirements-tools.txt)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          pip install -q "$(grep -E '^reuse==' requirements-tools.txt | cut -d' ' -f1)" \
                         "$(grep -E '^ruff==' requirements-tools.txt | cut -d' ' -f1)"
      - name: Documents agree with each other and the repository
        run: make check-docs
      - name: License information on every file
        run: make license
      - name: Shell scripts
        run: shellcheck -S warning scripts/*.sh tb/probes/p19_mutation/test_sim.sh
      - name: Python scripts
        run: ruff check --select F,E9,B scripts/*.py
